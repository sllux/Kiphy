<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kick Chat Overlay - Comic Speech Bubble</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
    }

    /* Container de mensagens */
    #chat-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 100%;
      overflow: hidden;
      align-items: flex-start;
      mask-image: linear-gradient(to top, rgba(0,0,0,1) 93%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 93%, rgba(0,0,0,0) 100%);
    }

    /* Cada conjunto de mensagem (Nome + Balão) */
    .message-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      max-width: 100%;
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .message-wrapper.fade-out {
      opacity: 0;
      transform: translateY(-8px) scale(0.98);
    }

    /* Tag do Usuário / Cabeçalho Roxo */
    .username-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #601ed8; /* Roxo vibrante estilo Twitch/Live */
      color: #ffffff;
      border: 2px solid #000000;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: -0.2px;
      z-index: 2;
      margin-left: 2px;
      box-shadow: 2px 2px 0px rgba(0,0,0,0.25);
    }

    .badges {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .badge-icon {
      width: 15px;
      height: 15px;
      object-fit: contain;
      vertical-align: middle;
    }

    .badge-symbol {
      font-size: 11px;
      line-height: 1;
    }

    .username-text {
      color: #ffffff;
      font-weight: 800;
      line-height: 1.2;
    }

    /* Balão de Fala Branco/Off-White */
    .speech-bubble {
      position: relative;
      background: #f2f0e6; /* Tom off-white/creme fiel ao print */
      color: #050505;
      border: 2px solid #000000;
      border-radius: 4px;
      padding: 6px 12px 6px 10px;
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.32;
      margin-left: 8px;
      margin-top: -1px; /* encosta sutilmente na tag do nome */
      display: inline-block;
      max-width: 95%;
      word-break: break-word;
      box-shadow: 2px 2px 0px rgba(0,0,0,0.25);
    }

    /* Rabicho do balão apontando para a esquerda (borda preta) */
    .speech-bubble::before {
      content: '';
      position: absolute;
      top: 5px;
      left: -9px;
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-right: 9px solid #000000;
    }

    /* Preenchimento do rabicho (cobre a borda preta interna) */
    .speech-bubble::after {
      content: '';
      position: absolute;
      top: 5px;
      left: -6px;
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-right: 7px solid #f2f0e6;
    }

    /* Emotes da Kick */
    .emote {
      display: inline-block;
      height: 28px;
      vertical-align: -6px;
      margin: 0 2px;
    }

    /* Estilos Especiais para Alertas de Sub / Gift / Follow */
    .alert-sub .username-tag {
      background: #D97706 !important; /* Dourado / Âmbar */
    }
    .alert-gift .username-tag {
      background: #DB2777 !important; /* Magenta / Rosa */
    }
    .alert-follow .username-tag {
      background: #7C3AED !important; /* Roxo vibrante de Follow */
    }
    .alert-raid .username-tag {
      background: #0891B2 !important; /* Ciano */
    }

    /* Indicador de status de conexão */
    #status-pill {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      background: rgba(0,0,0,0.65);
      border: 1px solid #333;
      border-radius: 20px;
      color: #53FC18;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.8;
      transition: opacity 0.3s;
    }
    #status-pill.hidden {
      display: none;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      background: #53FC18;
      border-radius: 50%;
      box-shadow: 0 0 6px #53FC18;
    }
    .status-dot.disconnected {
      background: #ff4444;
      box-shadow: 0 0 6px #ff4444;
    }
  </style>
</head>
<body>

  <div id="status-pill">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Conectando...</span>
  </div>

  <div id="chat-container"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const channel = urlParams.get('channel') || 'coringa';
    const fadeTimeout = parseInt(urlParams.get('fade') || '25', 10);
    const maxMessages = parseInt(urlParams.get('max') || '20', 10);
    const hideStatus = urlParams.get('hide_status') === 'true';
    const tagColorMode = urlParams.get('tag_color') || 'purple';

    const container = document.getElementById('chat-container');
    const statusPill = document.getElementById('status-pill');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    if (hideStatus) {
      statusPill.classList.add('hidden');
    }

    // Processamento de Emotes da Kick: [emote:ID:NAME]
    function parseEmotes(text) {
      if (!text) return '';
      let escaped = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      return escaped.replace(/\[emote:(\d+):([a-zA-Z0-9_-]+)\]/g, (match, emoteId, emoteName) => {
        return `<img class="emote" src="https://files.kick.com/emotes/${emoteId}/fullsize" alt="${emoteName}" title="${emoteName}" loading="lazy" />`;
      });
    }

    // Renderizar Badges
    function renderBadges(identity) {
      if (!identity) return '';
      let html = '<div class="badges">';

      if (Array.isArray(identity.badges_v2) && identity.badges_v2.length > 0) {
        for (const badge of identity.badges_v2) {
          if (badge.image_url) {
            html += `<img class="badge-icon" src="${badge.image_url}" alt="${badge.name || 'badge'}" />`;
          }
        }
      } else if (Array.isArray(identity.badges)) {
        for (const badge of identity.badges) {
          if (badge.type === 'broadcaster') {
            html += `<span class="badge-symbol" title="Host">👑</span>`;
          } else if (badge.type === 'moderator') {
            html += `<span class="badge-symbol" title="Moderador">🛡️</span>`;
          } else if (badge.type === 'vip') {
            html += `<span class="badge-symbol" title="VIP">💎</span>`;
          } else if (badge.type === 'verified') {
            html += `<span class="badge-symbol" title="Verificado">✔️</span>`;
          } else if (badge.type === 'subscriber') {
            html += `<span class="badge-symbol" title="Inscrito">⭐</span>`;
          }
        }
      }

      html += '</div>';
      return html;
    }

    function resolveTagColor(identity) {
      if (tagColorMode === 'kick') return '#53FC18';
      if (tagColorMode === 'user' && identity?.color) return identity.color;
      return '#601ed8';
    }

    // Adicionar Mensagem Normal de Chat
    function addMessage(msg) {
      if (!msg || !msg.sender) return;

      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper';
      wrapper.id = `msg-${msg.id}`;
      wrapper.dataset.username = (msg.sender.username || '').toLowerCase();

      const username = msg.sender.username || 'Anônimo';
      const badgesHtml = renderBadges(msg.sender.identity);
      const tagBgColor = resolveTagColor(msg.sender.identity);
      const parsedContent = parseEmotes(msg.content || '');

      wrapper.innerHTML = `
        <div class="username-tag" style="background-color: ${tagBgColor}">
          ${badgesHtml}
          <span class="username-text">${username}</span>
        </div>
        <div class="speech-bubble">
          ${parsedContent}
        </div>
      `;

      appendWithLimit(wrapper);
    }

    // Adicionar Alerta de Sub / Presente / Eventos Especiais no Chat
    function addAlert(alertType, tagLabel, bubbleText, icon) {
      const wrapper = document.createElement('div');
      wrapper.className = `message-wrapper alert-${alertType}`;

      wrapper.innerHTML = `
        <div class="username-tag">
          <span class="badge-symbol">${icon}</span>
          <span class="username-text">${tagLabel}</span>
        </div>
        <div class="speech-bubble">
          ${bubbleText}
        </div>
      `;

      appendWithLimit(wrapper);
    }

    function appendWithLimit(el) {
      container.appendChild(el);

      while (container.children.length > maxMessages) {
        container.removeChild(container.firstChild);
      }

      if (fadeTimeout > 0) {
        setTimeout(() => {
          el.classList.add('fade-out');
          setTimeout(() => {
            if (el.parentNode === container) {
              container.removeChild(el);
            }
          }, 450);
        }, fadeTimeout * 1000);
      }
    }

    // Conectar ao stream de eventos SSE
    function connectEvents() {
      statusText.textContent = `Kick: ${channel}`;
      statusDot.className = 'status-dot';

      const eventSource = new EventSource(`/events?channel=${encodeURIComponent(channel)}`);

      eventSource.onopen = () => {
        statusText.textContent = `Online: ${channel}`;
        statusDot.className = 'status-dot';
      };

      eventSource.onmessage = (event) => {
        try {
          const payload = JSON.parse(event.data);
          const type = payload.type;
          const data = payload.data;

          // 1. Mensagem de Chat normal (inclui replies e mensagens padrão)
          if (type && type.includes('ChatMessage')) {
            addMessage(data);
          }
          // 2. Nova Inscrição (Sub)
          else if (type === 'App\\Events\\SubscriptionEvent' || type === 'App\\Events\\ChannelSubscriptionEvent') {
            const username = data.username || data.user?.username || 'Alguém';
            const months = data.months || data.months_subscribed || 1;
            const monthsText = months > 1 ? ` (${months} meses)` : '';
            addAlert('sub', 'NOVA INSCRIÇÃO', `🎉 <b>${username}</b> acabou de se inscrever!${monthsText}`, '⭐');
          }
          // 3. Presente de Inscrições (Gifted Subs)
          else if (type === 'App\\Events\\GiftedSubscriptionsEvent') {
            const gifter = data.gifter_username || data.gifter?.username || 'Alguém';
            const count = Array.isArray(data.gifted_usernames) ? data.gifted_usernames.length : (data.giftedCount || 1);
            addAlert('gift', 'PRESENTE DE SUBS', `🎁 <b>${gifter}</b> presenteou <b>${count}</b> inscrição(ões) para o chat!`, '🎁');
          }
          // 4. Novo Seguidor (Follow)
          else if (type === 'App\\Events\\FollowEvent' || type === 'App\\Events\\FollowersUpdated' || type === 'FollowersUpdated') {
            const followerName = data.username || data.follower?.username || data.user?.username || null;
            const totalText = data.followersCount ? ` (Total: ${Number(data.followersCount).toLocaleString('pt-BR')})` : '';
            const followText = followerName
              ? `💜 <b>${followerName}</b> começou a seguir o canal!${totalText}`
              : `💜 Novo seguidor na live!${totalText}`;
            addAlert('follow', 'NOVO SEGUIDOR', followText, '👤');
          }
          // 5. Raid / Host
          else if (type === 'App\\Events\\StreamHostEvent') {
            const hoster = data.hoster_username || data.username || 'Um streamer';
            const viewers = data.number_viewers || data.viewers || '';
            const viewersText = viewers ? ` com <b>${viewers}</b> espectadores` : '';
            addAlert('raid', 'RAID / HOST', `🚀 <b>${hoster}</b> invadiu a live${viewersText}!`, '🚀');
          }
          // 5. Moderação: Mensagem Apagada
          else if (type === 'App\\Events\\MessageDeletedEvent') {
            const deletedId = data?.message?.id || data?.id;
            const targetEl = document.getElementById(`msg-${deletedId}`);
            if (targetEl) {
              targetEl.classList.add('fade-out');
              setTimeout(() => targetEl.remove(), 400);
            }
          }
          // 6. Moderação: Usuário Banido / Mutado
          else if (type === 'App\\Events\\UserBannedEvent') {
            const bannedUser = (data?.user?.username || '').toLowerCase();
            const elements = container.querySelectorAll(`[data-username="${bannedUser}"]`);
            elements.forEach(el => {
              el.classList.add('fade-out');
              setTimeout(() => el.remove(), 400);
            });
          }
        } catch (e) {
          console.error('Erro ao processar evento:', e);
        }
      };

      eventSource.onerror = () => {
        statusText.textContent = 'Reconectando...';
        statusDot.className = 'status-dot disconnected';
      };
    }

    connectEvents();
  </script>
</body>
</html>
